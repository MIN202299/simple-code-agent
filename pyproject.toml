[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nori-cli"
version = "0.4.0"
description = "Nori: a coding agent for the terminal, built on the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.24.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
nori = "nori.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nori"]

[tool.pytest.ini_options]
testpaths = ["tests"]
