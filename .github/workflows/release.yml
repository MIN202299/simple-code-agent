name: Release

# Builds standalone executables and publishes them as a GitHub Release.
#   - push a v* tag, or
#   - run manually with a tag name (the tag is created on the selected commit).
# A manual run without a tag only builds and uploads workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: nori-linux-x86_64
            binary: nori
          - os: macos-latest
            asset: nori-macos-arm64
            binary: nori
          - os: windows-latest
            asset: nori-windows-x86_64.exe
            binary: nori.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[build]"
      - name: Build
        run: python scripts/build.py
      - name: Rename
        shell: bash
        run: mv "dist/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Nori ${{ env.TAG }}
          files: dist/*
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
